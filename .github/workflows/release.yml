name: release-lgx

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build portable .lgx
        run: nix build .#lgx-portable -L

      - name: Stage asset
        run: |
          cp result/logos-onesecret_ui-module.lgx "onesecret_ui-${{ matrix.platform }}.lgx"
          shasum -a 256 "onesecret_ui-${{ matrix.platform }}.lgx" | tee "onesecret_ui-${{ matrix.platform }}.lgx.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            "onesecret_ui-${{ matrix.platform }}.lgx" \
            "onesecret_ui-${{ matrix.platform }}.lgx.sha256" --clobber
